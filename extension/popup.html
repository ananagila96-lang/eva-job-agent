<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body{font-family:Arial,sans-serif;width:300px;padding:14px;background:#111522;color:white}h3{margin:0 0 10px}label{display:block;font-size:12px;margin:8px 0}input{width:100%;box-sizing:border-box;padding:8px;margin-top:4px;background:#0b0e17;color:white;border:1px solid #343a52;border-radius:8px}button{width:100%;padding:9px;margin-top:8px;border:0;border-radius:8px;background:#7d8cff;font-weight:bold;cursor:pointer}.secondary{background:#2a3047;color:white}#status{font-size:12px;color:#b7bdd0;margin-top:8px}
  </style>
</head>
<body>
  <h3>EVA-01</h3>
  <label>Email para preenchimento<input id="email" type="email"></label>
  <label>Telefone para preenchimento<input id="phone" type="text"></label>
  <button id="save">Salvar dados locais</button>
  <button id="scan">Importar vagas visiveis</button>
  <button id="fill" class="secondary">Preencher campos basicos</button>
  <button id="dashboard" class="secondary">Abrir EVA-01</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
